# Runs the install line on clean machines, with this commit's setup.mjs instead of the stable branch's.
# Linux has no Node; macOS has no Node, first with Homebrew and then without; Windows has no Node, Git or Python.
# Windows also runs with an outdated Node first on PATH (the way nvm-windows, Volta or Scoop leave one), and without
# winget, which takes the same path as a PC without admin rights: winget's Node is machine-wide and needs admin.
# Passing means setup.mjs exited 0: it checks with `claude plugin list` that every plugin really is installed.
name: install
on:
  push:
    # A release pushes a commit that already passed on main; testing it again only risks a runner queue timeout.
    branches-ignore: [stable]
    paths: [install.sh, install.ps1, setup.mjs, '*.txt', settings.json, .github/workflows/install.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            path: /usr/bin:/bin:/usr/sbin:/sbin
          - os: macos-latest
            path: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          # Intel: Homebrew and the runner's Node live in /usr/local/bin, left off PATH here.
          - os: macos-15-intel
            path: /usr/bin:/bin:/usr/sbin:/sbin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          export HOME="$RUNNER_TEMP/home" PATH="${{ matrix.path }}"
          mkdir -p "$HOME" "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          grep -q 'refs/heads/stable' "$GITHUB_WORKSPACE/install.sh" || { echo "install.sh no longer downloads refs/heads/stable; update this test" >&2; exit 1; }
          sed "s#refs/heads/stable#$GITHUB_SHA#; s#ingot-stable#ingot-$GITHUB_SHA#" "$GITHUB_WORKSPACE/install.sh" | bash
      - name: Run again (the update path)
        run: |
          export HOME="$RUNNER_TEMP/home" PATH="$RUNNER_TEMP/home/.local/bin:$RUNNER_TEMP/home/.local/share/ingot-node/bin:${{ matrix.path }}"
          cd "$RUNNER_TEMP/project"
          # --no-tools: `yt-dlp -U` asks GitHub's API, which rate-limits shared runners now and then.
          node "$GITHUB_WORKSPACE/setup.mjs" --no-tools
          # setup.mjs only checks they're on PATH; these run them.
          python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
          ffmpeg -version | sed -n 1p && ffprobe -version | sed -n 1p
      # A step, not a second Mac job: GitHub's Mac runners are scarce and queued jobs get cancelled.
      - name: Python and ffmpeg without Homebrew
        if: runner.os == 'macOS'
        run: |
          # A fresh home with Apple's Python 3.9 and no ffmpeg; the first home's Node and language servers are reused.
          export HOME="$RUNNER_TEMP/nobrew" PATH="$RUNNER_TEMP/nobrew/.local/bin:$RUNNER_TEMP/home/.local/share/ingot-node/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          mkdir -p "$HOME" && cd "$RUNNER_TEMP/project"
          node "$GITHUB_WORKSPACE/setup.mjs" --no-plugins
          python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
          ffmpeg -version | sed -n 1p && ffprobe -version | sed -n 1p
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: no-node
            drop: 'nodejs|\\Git\\|\\npm|hostedtoolcache'
          - case: old-node
            drop: 'nodejs|\\Git\\|\\npm|hostedtoolcache'
          # Git stays: without winget, installing it is the user's job. --no-tools: Python, ffmpeg and yt-dlp need winget.
          - case: no-winget
            drop: 'nodejs|\\npm|hostedtoolcache|WindowsApps'
            args: --no-tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take Node, Python and more off the saved PATH
        shell: powershell
        run: |
          foreach ($scope in 'Machine', 'User') {
            $kept = [Environment]::GetEnvironmentVariable('Path', $scope) -split ';' | Where-Object { $_ -and $_ -notmatch '${{ matrix.drop }}' }
            [Environment]::SetEnvironmentVariable('Path', ($kept -join ';'), $scope)
          }
      - name: Put Node 20 first on the user PATH
        if: matrix.case == 'old-node'
        shell: powershell
        run: |
          $base = 'https://nodejs.org/dist/latest-v20.x'
          $file = (Invoke-WebRequest -UseBasicParsing "$base/SHASUMS256.txt").Content -split "`n" | ForEach-Object { ($_ -split '\s+')[1] } | Where-Object { $_ -like '*-win-x64.zip' }
          Invoke-WebRequest -UseBasicParsing "$base/$file" -OutFile "$env:RUNNER_TEMP\node20.zip"
          Expand-Archive "$env:RUNNER_TEMP\node20.zip" "$env:LOCALAPPDATA\oldnode"
          $dir = (Get-ChildItem "$env:LOCALAPPDATA\oldnode")[0].FullName
          [Environment]::SetEnvironmentVariable('Path', "$dir;" + [Environment]::GetEnvironmentVariable('Path', 'User'), 'User')
      - name: Install
        shell: powershell
        run: |
          # What a new terminal gets. The runner points npm's global folder at one taken off PATH above.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:NPM_CONFIG_PREFIX = $null
          New-Item -ItemType Directory C:\proj | Out-Null
          Set-Location C:\proj
          $script = Get-Content -Raw "$env:GITHUB_WORKSPACE\install.ps1"
          if ($script -notmatch 'refs/heads/stable') { throw 'install.ps1 no longer downloads refs/heads/stable; update this test' }
          # The README's form for options; it also passes none.
          & ([scriptblock]::Create(($script -replace 'refs/heads/stable', $env:GITHUB_SHA -replace 'ingot-stable', "ingot-$env:GITHUB_SHA"))) ${{ matrix.args }}
          exit $LASTEXITCODE
      - name: Tools and language servers, once winget is back
        if: matrix.case == 'no-winget'
        shell: powershell
        run: |
          [Environment]::SetEnvironmentVariable('Path', [Environment]::GetEnvironmentVariable('Path', 'User') + ";$env:LOCALAPPDATA\Microsoft\WindowsApps", 'User')
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:NPM_CONFIG_PREFIX = $null
          "node: $((Get-Command node).Source), npm global folder: $(npm config get prefix)"
          Set-Location C:\proj
          node "$env:GITHUB_WORKSPACE\setup.mjs"
          exit $LASTEXITCODE
