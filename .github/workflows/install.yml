# Runs the real install line on clean machines: no Homebrew, no Node, an empty home folder.
name: install
on:
  push:
    paths: [install.sh, setup.mjs, '*.txt', settings.json, .github/workflows/install.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install on a clean machine
        run: |
          set +e
          export HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin:/usr/sbin:/sbin
          mkdir -p "$HOME" "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          echo "bash $BASH_VERSION, python3: $(python3 --version 2>&1), git: $(git --version 2>&1)"
          cat "$GITHUB_WORKSPACE/install.sh" | bash || echo "install.sh exit code $?"
          echo ---- yt-dlp update; "$HOME/.local/bin/yt-dlp" --ignore-config -U; echo "exit $?"; "$HOME/.local/bin/yt-dlp" --version; file "$HOME/.local/bin/yt-dlp"; xattr -l "$HOME/.local/bin/yt-dlp"
          echo ---- re-run with this commit
          export PATH="$HOME/.local/bin:$HOME/.local/share/ingot-node/bin:$PATH"
          node "$GITHUB_WORKSPACE/setup.mjs" || echo "setup.mjs exit code $?"
          echo ---- result
          claude plugin list --json || true
          cat .claude/settings.json || true
          ls -la "$HOME" "$HOME/.local/bin" || true
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install on a clean machine
        shell: powershell
        run: |
          # No Node or Git on the saved PATH or this window's PATH; the runner has no winget.
          $clean = { param($p) ($p -split ';' | Where-Object { $_ -and $_ -notmatch 'nodejs|\Git\|\npm|hostedtoolcache' }) -join ';' }
          [Environment]::SetEnvironmentVariable('Path', (& $clean ([Environment]::GetEnvironmentVariable('Path', 'Machine'))), 'Machine')
          [Environment]::SetEnvironmentVariable('Path', (& $clean ([Environment]::GetEnvironmentVariable('Path', 'User'))), 'User')
          $env:Path = & $clean $env:Path
          "winget: $([bool](Get-Command winget -ErrorAction SilentlyContinue)), node: $([bool](Get-Command node -ErrorAction SilentlyContinue)), git: $([bool](Get-Command git -ErrorAction SilentlyContinue)), PS $($PSVersionTable.PSVersion)"
          New-Item -ItemType Directory C:\proj | Out-Null
          Set-Location C:\proj
          Get-Content -Raw "$env:GITHUB_WORKSPACE\install.ps1" | Invoke-Expression
          "exit code: $LASTEXITCODE"
          exit 0
