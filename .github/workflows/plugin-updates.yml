# Weekly: for each third-party marketplace pinned to a tag in marketplaces.txt, checks the repo's latest GitHub
# release and opens an issue when it is newer than the pin. One open issue per update, so it doesn't repeat weekly.
# The pin itself moves by hand, only after the evals pass on the new tag.
name: plugin-updates
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pins to latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Set DRY_RUN=1 locally to print instead of opening issues.
          DRY_RUN: ''
          MARKETPLACES: marketplaces.txt
        run: |
          open_titles=$([ -n "$DRY_RUN" ] || gh issue list --state open --limit 500 --json title --jq '.[].title')
          grep -v '^#' "$MARKETPLACES" | while read -r name spec; do
            case "$spec" in *'#'*) ;; *) continue ;; esac
            repo=${spec%%#*} pin=${spec#*#}
            [ "$repo" = CIGIBWARIN/ingot ] && continue
            latest=$(gh release view -R "$repo" --json tagName --jq .tagName) || { echo "::warning::no release for $repo"; continue; }
            newest=$(printf '%s\n%s\n' "$pin" "$latest" | sort -V | tail -n1)
            if [ "$latest" = "$pin" ] || [ "$newest" != "$latest" ]; then echo "$name: $pin is current"; continue; fi
            title="Update available: $name $pin → $latest"
            if grep -qxF "$title" <<<"$open_titles"; then echo "$name: issue already open"; continue; fi
            body="[$repo $latest](https://github.com/$repo/releases/tag/$latest) is out; marketplaces.txt pins $pin.

          Move the pin only after \`node evals/run.mjs <suite> --ref $latest\` passes."
            if [ -n "$DRY_RUN" ]; then echo "would open: $title"; echo "$body"; else gh issue create --title "$title" --body "$body"; fi
          done
